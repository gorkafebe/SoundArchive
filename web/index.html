<!doctype html>
<!--
  The page Vite builds into dist/index.html. React fills <div id="root">.
  The system check page from the walking skeleton is still at /status.html
  (web/public/status.html).
-->
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sound Archive: a map of places and how they sound." />
    <title>Sound Archive</title>
    <!-- Applies the saved theme and language before the app starts, so a
         dark-theme user never sees a light flash. A file, not inline code,
         because the Content-Security-Policy (Caddyfile) forbids inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Sound Archive needs JavaScript. / Sound Archive necesita JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Alembic configuration. Alembic applies database migrations: numbered Python
# files in alembic/versions/ that change the schema step by step.
#
# The database URL is NOT here: alembic/env.py reads it from the same
# environment variables as the API (app/config.py), so no password is in git.

[alembic]
script_location = %(here)s/alembic
# Migration file names: 2026_11_01_0001-enable_postgis.py (sortable by date).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s-%%(slug)s
prepend_sys_path = .

# --- Logging (standard Python logging config) --------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

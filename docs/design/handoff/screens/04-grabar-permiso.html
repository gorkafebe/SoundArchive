<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Grabar · permiso de micrófono</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:wght@500;600&display=swap"><style>
body{margin:0}
.t-light{--surface-100:#f3f6fa;--surface-200:#ffffff;--surface-300:#e4eaf2;--ink:#14202e;--ink-muted:#4a5a6e;--line:#d3dce8;--line-strong:#6b7a8f;--accent:#1d5fb4;--on-accent:#ffffff;--accent-soft:#d9e6f7;--success:#146a5c;--warning:#8a5a00;--danger:#b3401c;--map-land:#e9eef4;--map-water:#c5d8ec;--map-road:#d5dde8;--map-label:#4a5a6e;--shadow-sheet:0 -6px 24px rgba(20,32,46,0.14);--shadow-pin:0 2px 6px rgba(20,32,46,0.3)}.t-dark{--surface-100:#0f1722;--surface-200:#16212f;--surface-300:#1f2d3f;--ink:#e8eef6;--ink-muted:#a3b2c5;--line:#2a3a50;--line-strong:#7d8da3;--accent:#7db3f2;--on-accent:#07121f;--accent-soft:#1d3556;--success:#6fd0bd;--warning:#e0a93c;--danger:#f0906b;--map-land:#131d2a;--map-water:#0b121b;--map-road:#243348;--map-label:#a3b2c5;--shadow-sheet:0 -6px 24px rgba(0,0,0,0.55);--shadow-pin:0 2px 6px rgba(0,0,0,0.6)}
.sa{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;line-height:24px;color:var(--ink);background:var(--surface-100);box-sizing:border-box;position:relative;overflow:hidden}
.sa *{box-sizing:border-box}.sa h1,.sa h2,.sa h3,.sa h4,.sa p{margin:0}
.serif{font-family:'Newsreader',Georgia,serif}.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface-200);color:var(--ink);font:700 14px/20px 'Atkinson Hyperlegible',sans-serif;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.q{border-color:transparent;background:transparent;color:var(--accent)}.btn.d{border-color:var(--danger);color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px;border-radius:6px;background:var(--surface-300);color:var(--ink);font:700 13px/18px 'Atkinson Hyperlegible',sans-serif}
.badge.ok{color:var(--success)}.badge.wa{color:var(--warning)}.badge.da{color:var(--danger)}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font:700 14px/20px 'Atkinson Hyperlegible',sans-serif}
.fld input,.fld textarea,.fld select{min-height:44px;padding:8px 12px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface-200);color:var(--ink);font:400 16px/24px 'Atkinson Hyperlegible',sans-serif}
.help{font-size:13px;line-height:18px;color:var(--ink-muted)}.err{font-size:13px;line-height:18px;font-weight:700;color:var(--danger)}
.card{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface-200)}
.card.on{background:var(--accent-soft);border-color:var(--accent)}
.disc{width:44px;height:44px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.wave{display:flex;align-items:center;gap:2px;height:56px;padding:8px;border-radius:12px;background:var(--surface-300)}.wave b{flex:1;min-width:2px;border-radius:2px;background:var(--line-strong)}.wave b.on{background:var(--accent)}
.sheet{background:var(--surface-200);border-radius:20px 20px 0 0;box-shadow:var(--shadow-sheet);padding:8px 16px 16px}
.grab{width:44px;height:6px;border-radius:999px;background:var(--line-strong);margin:0 auto 12px}
.pin{position:absolute;width:44px;height:44px;display:grid;place-items:center}.pin i{width:20px;height:20px;border-radius:999px;background:var(--accent);border:3px solid var(--surface-200);box-shadow:var(--shadow-pin)}.pin.sel i{width:28px;height:28px;outline:6px solid var(--accent-soft)}
.clu{position:absolute;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);border:3px solid var(--surface-200);box-shadow:var(--shadow-pin);font:700 14px/20px 'Atkinson Hyperlegible',sans-serif}
.attr{position:absolute;right:8px;padding:2px 8px;border-radius:6px;background:var(--surface-200);color:var(--ink-muted);font-size:13px;line-height:18px}
.top{display:flex;gap:8px;align-items:center}
.search{flex:1;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface-200);color:var(--ink-muted)}
.seg{display:inline-flex;border:2px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface-200)}.seg span{min-height:40px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;font:700 14px/20px 'Atkinson Hyperlegible',sans-serif}.seg span.on{background:var(--accent);color:var(--on-accent)}
.photo{flex:1;aspect-ratio:4/3;border-radius:12px;background:var(--surface-300);border:2px dashed var(--line-strong);display:grid;place-items:center;color:var(--ink-muted);font-size:13px;text-align:center;padding:4px}
.rec{width:72px;height:72px;border-radius:999px;border:4px solid var(--surface-200);outline:2px solid var(--accent);background:var(--accent);color:var(--on-accent);display:grid;place-items:center}.rec.live{background:var(--danger);outline-color:var(--danger)}
.meter{display:flex;gap:3px;height:32px;align-items:flex-end}.meter b{width:8px;border-radius:2px;background:var(--line-strong)}.meter b.on{background:var(--accent)}
.mini{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:20px;background:var(--surface-200);box-shadow:var(--shadow-sheet);border:2px solid var(--line)}
.box{border:2px solid var(--line);border-radius:12px;background:var(--surface-200);padding:16px}
.meta{font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:18px;color:var(--ink-muted)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}
.sk{border-radius:8px;background:var(--surface-300);height:16px}
.toast{display:inline-flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--surface-100);font:700 14px/20px 'Atkinson Hyperlegible',sans-serif}
</style></head><body><div class="sa t-light" style="width:390px;height:844px"><svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0"><rect width="390" height="844" fill="var(--map-land)"/><path d="M0 523.28 C 97.5 422.0, 175.5 658.32, 273.0 557.0400000000001 S 390 590.8, 390 675.2 L 390 844 L 0 844 Z" fill="var(--map-water)"/><g stroke="var(--map-road)" stroke-width="6" fill="none" stroke-linecap="round"><path d="M0 168.8 L 390 270.08"/><path d="M117.0 0 L 163.79999999999998 506.4"/><path d="M304.2 0 L 257.40000000000003 489.52"/><path d="M0 354.47999999999996 L 234.0 337.6"/></g><text x="39.0" y="118.16000000000001" font-family="Atkinson Hyperlegible" font-size="13" fill="var(--map-label)">Madrid</text><text x="202.8" y="607.68" font-family="Atkinson Hyperlegible" font-size="13" fill="var(--map-label)">Manzanares</text></svg><div style="position:absolute;inset:0;background:rgba(20,32,46,0.45)"></div><div style="position:absolute;left:16px;right:16px;bottom:16px" class="box"><div style="display:flex;flex-direction:column;gap:12px"><span style="color:var(--accent)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg></span><h3 class="serif" style="font:600 20px/28px Newsreader,serif">¿Usar el micrófono?</h3><p>Solo grabamos mientras la grabación está en marcha. El navegador te preguntará a continuación. Si prefieres no hacerlo, puedes subir un archivo.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" style="">Continuar</button><button class="btn q" style=""><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Subir un archivo</button></div></div></div></div></body></html>

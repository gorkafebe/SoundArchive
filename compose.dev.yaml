# Dev overrides, used together with compose.yaml:
#   make up
# Only what differs from the base file is here.

x-backend-dev: &backend-dev
  build:
    context: ./backend
    # The "dev" stage of backend/Dockerfile: includes pytest, runs with --reload.
    target: dev
  # A different tag, so the dev image never overwrites the prod one.
  image: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env, see .env.example}-backend:dev
  volumes:
    # Use the code from this laptop instead of the copy inside the image.
    # Edit a .py file, and the API reloads; add a migration, and the next
    # `make migrate` sees it. No rebuild needed.
    # (Rebuild only when dependencies change: make up runs --build.)
    - ./backend:/app

services:
  db:
    ports:
      # For database GUI tools (DBeaver, pgAdmin, VS Code extensions).
      # 127.0.0.1 = reachable from this laptop only, not from the network.
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"

  migrate:
    <<: *backend-dev
  worker:
    <<: *backend-dev
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - media:/media
  maintenance:
    <<: *backend-dev
    command: ["python", "-m", "app.worker.maintenance"]
    volumes:
      - ./backend:/app
      - media:/media
  api:
    <<: *backend-dev
    volumes:
      - ./backend:/app
      - media:/media
    environment:
      ALLOWED_ORIGINS: https://testserver
      # Dev only: admin credentials for the privilege test in
      # backend/tests/test_database.py, which creates a throwaway table as the
      # admin and checks the app user can use it. The API code never reads
      # these, and prod never sets them.
      TEST_ADMIN_DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      TEST_ADMIN_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Dev creates places freely (prod defaults to false, see compose.yaml).
      # ALLOW_ANONYMOUS_WRITES=false in .env tries the "disabled" state.
      ALLOW_ANONYMOUS_WRITES: ${ALLOW_ANONYMOUS_WRITES:-true}

  caddy:
    # Same build as prod, under a dev tag. After editing web/ or the
    # Caddyfile, `make up` rebuilds it (or use `make web-dev` for instant reload).
    image: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env, see .env.example}-web:dev
    ports:
      # DEV_HTTP_BIND picks the network interface. The default, 127.0.0.1,
      # means this computer only. Set DEV_HTTP_BIND=0.0.0.0 in .env (all
      # interfaces) on the dev laptop to open http://<laptop-IP>:8080 from a
      # phone on the same Wi-Fi. Never do that on the MSI: ports 80/443 there
      # belong to the real app, and anything else stays private.
      - "${DEV_HTTP_BIND:-127.0.0.1}:${DEV_HTTP_PORT:-8080}:80"

  # Optional: Vite's dev server, with instant reload when you save a file in
  # web/. Not started by `make up`; run `make web-dev` (after `make up`) and
  # open http://localhost:5173. It forwards /api to Caddy, like production.
  # Needs `make web-install` once (it uses web/node_modules from your disk).
  web-dev:
    profiles: [web-dev]
    image: node:26.13.0-alpine3.24  # same as NODE_IMAGE in the Makefile
    working_dir: /app
    # The node image's own user (uid 1000), usually the same as yours on Linux.
    user: node
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_PROXY: http://caddy:80
    volumes:
      - ./web:/app
    ports:
      - "${DEV_HTTP_BIND:-127.0.0.1}:${DEV_WEB_PORT:-5173}:5173"
    depends_on:
      caddy:
        condition: service_healthy

# Dev overrides, used together with compose.yaml:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d     (make up)
# Only what differs from the base file is here.

x-backend-dev: &backend-dev
  build:
    context: ./backend
    # The "dev" stage of backend/Dockerfile: includes pytest, runs with --reload.
    target: dev
  # A different tag, so the dev image never overwrites the prod one.
  image: ${COMPOSE_PROJECT_NAME:-sound-archive}-backend:dev
  volumes:
    # Use the code from this laptop instead of the copy inside the image.
    # Edit a .py file, and the API reloads; add a migration, and the next
    # `make migrate` sees it. No rebuild needed.
    # (Rebuild only when dependencies change: make up runs --build.)
    - ./backend:/app

services:
  db:
    ports:
      # For database GUI tools (DBeaver, pgAdmin, VS Code extensions).
      # 127.0.0.1 = reachable from this laptop only, not from the network.
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"

  migrate:
    <<: *backend-dev

  api:
    <<: *backend-dev
    environment:
      # Dev only: admin credentials for the privilege test in
      # backend/tests/test_database.py, which creates a throwaway table as the
      # admin and checks the app user can use it. The API code never reads
      # these, and prod never sets them.
      TEST_ADMIN_DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      TEST_ADMIN_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  caddy:
    ports:
      # DEV_HTTP_BIND picks the network interface. The default, 127.0.0.1,
      # means this computer only. Set DEV_HTTP_BIND=0.0.0.0 in .env (all
      # interfaces) on the dev laptop to open http://<laptop-IP>:8080 from a
      # phone on the same Wi-Fi. Never do that on the MSI: ports 80/443 there
      # belong to the real app, and anything else stays private.
      - "${DEV_HTTP_BIND:-127.0.0.1}:${DEV_HTTP_PORT:-8080}:80"

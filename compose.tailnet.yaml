# Tailnet-only instance, used together with compose.yaml:
#   make tailnet-up
#   (COMPOSE_PROJECT_NAME=sa-tailnet docker compose -p sa-tailnet -f compose.yaml -f compose.tailnet.yaml up -d)
#
# Not combined with compose.prod.yaml: Compose ADDS the "ports" of every file,
# so that file's 80/443 on all interfaces could not be removed from here.
#
# Reachability: Caddy is the only service with a published port, and only on
# 127.0.0.1. From outside the MSI the single way in is the Tailscale forward
# that the owner set up (tailscale serve --tcp=8443 -> 127.0.0.1:9443).
# Docker-published ports bypass ufw: `make exposure-check` is what proves this.
#
# Two networks: "default" joins Caddy and the API. "backend" has no route to
# the Internet (internal: true) and holds everything else, so the code that
# parses uploaded audio cannot reach out even if a file exploited ffmpeg.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Containers that run our code: no extra Linux capabilities, and no way to
# gain any later (a setuid binary, for instance).
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    <<: *logging
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    networks: [backend]

  migrate:
    <<: [*logging, *hardened]
    restart: "no"
    networks: [backend]

  redis:
    <<: *logging
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    networks: [backend]

  worker:
    <<: [*logging, *hardened]
    restart: unless-stopped
    # Decoding long files is the heaviest thing on this machine.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 200
    networks: [backend]

  maintenance:
    <<: [*logging, *hardened]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks: [backend]

  api:
    <<: [*logging, *hardened]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2.0
    networks: [default, backend]
    environment:
      # /api/docs loads its script from a public CDN: off.
      API_DOCS_ENABLED: "false"
      ALLOW_ANONYMOUS_WRITES: "false"
      # Addresses the app is opened from. The CSRF check compares the browser's
      # Origin header with this list. No "*": a list of exact origins only.
      ALLOWED_ORIGINS: "https://soundarchive:8443,https://${TAILNET_FQDN:?set TAILNET_FQDN in .env}:8443,https://localhost:${TAILNET_HTTPS_PORT:-9443},https://soundarchive:${TAILNET_HTTPS_PORT:-9443}"

  caddy:
    <<: *logging
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    networks: [default]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.tailnet", "--adapter", "caddyfile"]
    environment:
      TAILNET_FQDN: ${TAILNET_FQDN:?set TAILNET_FQDN in .env}
      MAP_TILE_ORIGINS: ${MAP_TILE_ORIGINS:-https://tiles.openfreemap.org}
    ports:
      # 127.0.0.1 written out on purpose: a bare "9443:443" would mean every
      # interface, and Docker would open it straight through the firewall.
      - "127.0.0.1:${TAILNET_HTTPS_PORT:-9443}:443"
      - "127.0.0.1:${TAILNET_HTTP_PORT:-9080}:80"

networks:
  backend:
    internal: true
